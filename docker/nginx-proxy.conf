map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- API subdomain: /v1, /webhooks, /up only. Root redirects to landing. ---
server {
    listen 80;
    server_name api.ticketlens.test;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = / {
        return 302 http://ticketlens.test/;
    }

    location /v1/       { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }
    location /webhooks/ { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }
    location = /up      { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }

    location / { return 404; }
}

# --- Primary hostname: static landing + Laravel Console + Vite assets ---
server {
    listen 80 default_server;
    server_name ticketlens.test;
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx defaults to 1M, below Laravel's own upload limits (e.g. avatar's
    # max:2048 KB) — without this, a valid-sized upload never reaches Laravel's
    # validation and fails with a raw, unstyled 413 instead of a form error.
    client_max_body_size 20M;

    # Laravel Console (Inertia) — all console/* paths.
    location /console       { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }
    # Broadcasting channel auth (POST /broadcasting/auth) — must reach Laravel
    location /broadcasting/ { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }

    # Reverb WebSocket — same pattern as production's nginx.conf, proxied on
    # the app's own origin/port so a single tunnel (ngrok or otherwise)
    # carries both HTTP and WS traffic. Pusher-js's default path is /app/{key}.
    # _proxy-headers.conf's 300s read timeout is fine — Reverb pings every
    # 60s (config/reverb.php ping_interval), well inside that window.
    location /app/ { proxy_pass http://reverb:8080; include /etc/nginx/conf.d/_proxy-headers.conf; }

    # API routes, mirrored from the api.ticketlens.test vhost below — a single
    # ngrok tunnel forwards one Host header, so remote CLI testing needs both
    # console and API traffic reachable on the same default_server.
    location /v1/       { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }
    location /webhooks/ { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }
    location = /up      { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }

    # Vite dev assets + HMR (served by Vite inside laravel.test container on :5173)
    location /@vite/      { proxy_pass http://laravel.test:5173; include /etc/nginx/conf.d/_proxy-headers.conf; }
    location /@id/        { proxy_pass http://laravel.test:5173; include /etc/nginx/conf.d/_proxy-headers.conf; }
    location /@fs/        { proxy_pass http://laravel.test:5173; include /etc/nginx/conf.d/_proxy-headers.conf; }
    location /@react-refresh { proxy_pass http://laravel.test:5173; include /etc/nginx/conf.d/_proxy-headers.conf; }
    location /resources/  { proxy_pass http://laravel.test:5173; include /etc/nginx/conf.d/_proxy-headers.conf; }
    location /node_modules/ { proxy_pass http://laravel.test:5173; include /etc/nginx/conf.d/_proxy-headers.conf; }
    # Vite HMR WebSocket
    location /vite-ws     { proxy_pass http://laravel.test:5173; include /etc/nginx/conf.d/_proxy-headers.conf; }
    # Production build assets (if ever used) — stays on Laravel
    location /build/      { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }
    # Static assets served from Laravel's public/ (e.g. theme-init.js) — stays on Laravel
    location /js/          { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }
    # User-uploaded files via the public disk symlink (e.g. avatars) — stays on Laravel
    location /storage/     { proxy_pass http://laravel.test:80; include /etc/nginx/conf.d/_proxy-headers.conf; }

    # Static landing for / and any other path with a matching file
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
